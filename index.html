<!DOCTYPE html>
<html>

<head>
   <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://libs.zappar.com/zappar-aframe/2.0.0/zappar-aframe.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>


  <meta charset="utf-8" />
  <title>Zappar for A-Frame: Animation Controls Example</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    /* Стили для кнопок */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
    }

    .control-btn {
      padding: 12px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.3s;
      min-width: 120px;
    }

    .control-btn:hover {
      background: #45a049;
    }

    .control-btn:active {
      background: #3d8b40;
    }
  </style>
</head>

<body>
  <!-- Контейнер для кнопок управления (будет заполнен автоматически) -->
  <div class="controls"></div>

  <a-scene>
    <!-- Ask user for camera permissions, display some text if permission is denied -->
    <a-entity zappar-permissions-ui id="permissions"></a-entity>
    <!-- shows a full-page dialog that informs the user they're using an unsupported browser -->
    <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

    <!-- ОСНОВНОЙ СВЕТ -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.6"></a-light>
    
    <!-- ДИРЕКЦИОННЫЙ СВЕТ (как солнце) -->
    <a-light type="directional" 
             color="#FFFFFF" 
             intensity="0.8" 
             position="2 5 3">
    </a-light>
    
    <!-- ТОЧЕЧНЫЙ СВЕТ (рядом с моделью) -->
    <a-light type="point" 
             color="#FFFFFF" 
             intensity="1.0" 
             position="0 3 2"
             distance="10"
             decay="2">
    </a-light>

    <a-camera zappar-camera>
      <!-- Убрал рэйкастер -->
    </a-camera>

    <a-entity zappar-pattern="target: assets/track5.patt">

      <!-- Have a group that will only become visible when the target image comes into view-->
      <a-entity visibility-changer>

        <!-- Убрал hotspot plane (фон под моделью) -->

        <!-- Include our 3D model-->
        <a-entity rotation="90 0 0" id="model" gltf-model="url(assets/2nmstu.glb)" animation-mixer="clip: null" scale="0.01 0.01 0.01"></a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    // Массив анимаций - легко добавлять новые!
    const animations = [
      { name: "Центр", clip: "center" },
      { name: "Юг", clip: "south" },
      { name: "Покой", clip: "Idle" },
      // Добавляй новые анимации здесь:
      // { name: "Новая анимация", clip: "newAnimation" },
      // { name: "Еще одна", clip: "anotherOne" }
    ];

    // Only show our content when the image becomes visible
    AFRAME.registerComponent("visibility-changer", {
        init: function () {
            this.el.setAttribute("visible", false)
            this.el.sceneEl.addEventListener('zappar-visible', () => this.el.setAttribute("visible", true));
        }
    })

    // Универсальная функция для воспроизведения анимации
    function playAnimation(index) {
        if (index >= 0 && index < animations.length) {
            const animation = animations[index];
            const model = document.getElementById('model');
            
            // Останавливаем текущую анимацию и запускаем новую
            model.setAttribute("animation-mixer", {
                clip: animation.clip,
                repetitions: 1,
                clampWhenFinished: true
            });
        }
    }

    // Функция для создания кнопок при загрузке страницы
    function createButtons() {
        const controlsContainer = document.querySelector('.controls');
        
        animations.forEach((animation, index) => {
            const button = document.createElement('button');
            button.className = 'control-btn';
            button.textContent = animation.name;
            button.onclick = () => playAnimation(index);
            controlsContainer.appendChild(button);
        });
    }

    // Создаем кнопки когда страница загрузится
    window.addEventListener('DOMContentLoaded', createButtons);
  </script>
</body>

</html>
